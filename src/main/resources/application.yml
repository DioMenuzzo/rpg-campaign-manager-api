spring:
  application:
    name: rpg-campaign-manager-api

  # Variáveis de ambiente com valores padrão para rodar local.
  # Em produção (etapa 3, AWS RDS) basta sobrescrever RPG_DB_URL / RPG_DB_USERNAME / RPG_DB_PASSWORD.
  datasource:
    url: ${RPG_DB_URL:jdbc:postgresql://localhost:5433/rpgmanager}
    username: ${RPG_DB_USERNAME:rpg}
    password: ${RPG_DB_PASSWORD:rpg}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Fichas de personagem. Em produção: RPG_MONGO_URI apontando para o cluster (etapa 3).
  data:
    mongodb:
      uri: ${RPG_MONGO_URI:mongodb://localhost:27017/rpgmanager}
      auto-index-creation: true   # cria o índice único de characterId

  jackson:
    default-property-inclusion: non_null

server:
  port: ${RPG_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness e /readiness (Docker, ECS, k8s)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
